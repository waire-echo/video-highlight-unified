[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-highlight-unified"
version = "0.1.0"
description = "Reproducible video highlight research pipelines and experiment registry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "Pillow>=10", "tzdata; platform_system=='Windows'"]

[project.scripts]
vh = "video_highlight.runner:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_highlight = ["spatial/*.yaml"]
"video_highlight.workflow" = ["ui/*.html", "ui/*.css", "ui/*.js"]
